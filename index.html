<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sorting Algorithm Visualization Tool</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body>
        <h2>Sorting Algorithm Visualization Tool</h2>
        <!-- <div class="algo-selection">
            <p id="algorithm">Algorithm:</p>
            <select id="selection1">
                <option selected value="1">Bubble Sort</option>
                <option value="2">Selection Sort</option>
                <option value="3">Insertion Sort</option>
                <option value="4">Quick Sort</option>
                <option value="5">Merge Sort</option>
                <option value="6">Radix Sort</option>
            </select>
        </div> -->
        
        <div class="mode">
            <div class="set-array">
                <button id="custom">Custom Array</button>
                <button id="random">Random Array</button>
                <div class="input">
                    <!-- <input type="number" placeholder="Number of elements(max 15)"> -->
                    <input id="elements" type="text" placeholder="Numbers (<100) separated by commas (max 15 elements)">
                    <button id="set-array">Set Array</button>
                </div>
            </div>
            <div class="form-check form-switch form-check-reverse">
                <input class="form-check-input" type="checkbox" id="switch">
                <label class="form-check-label">Compare 2 algorithms</label>
            </div>
        </div>
        
        <div class="algo-selection">
            <div class="algo-selection-1">
                <p id="algorithm">Algorithm:</p>
                <select id="selection1">
                    <option selected value="1">Bubble Sort</option>
                    <option value="2">Selection Sort</option>
                    <option value="3">Insertion Sort</option>
                    <option value="4">Quick Sort</option>
                    <option value="5">Merge Sort</option>
                    <option value="6">Radix Sort</option>
                </select>
            </div>
            <div class="algo-selection-2">
                <p id="algorithm">Algorithm:</p>
                <select id="selection1">
                    <option selected value="1">Bubble Sort</option>
                    <option value="2">Selection Sort</option>
                    <option value="3">Insertion Sort</option>
                    <option value="4">Quick Sort</option>
                    <option value="5">Merge Sort</option>
                    <option value="6">Radix Sort</option>
                </select>
            </div>
        </div>
        
        <div class="control">
            <div class="run-algo">
                <!-- <button id="before">
                    <i class="bi bi-rewind"></i>
                </button>
                <button id="play">
                    <i class="bi bi-play"></i>
                </button>
                <button id="next">
                    <i class="bi bi-fast-forward"></i>
                </button>
                <button id="reset">
                    <i class="bi bi-arrow-repeat"></i>
                </button> -->
                <button id="play">
                    <i class="bi bi-play"></i> Run
                </button>
            </div>
            <div class="speed-selection">
                <p id="speed">Speed:</p>
                <select id="selection2">
                    <option value="1">0.5x</option>
                    <option selected value="2">1x</option>
                    <option value="3">1.5x</option>
                    <option value="4">2x</option>
                </select>
            </div>
        
        </div>
        
        <div id="single-container">
            <div class="bar-container">
            </div>
        </div>
        
        <div id="compare-container">
            <div class="row">
                <div class="col-md-6 border-end">
                    <h6 class="text-center text-primary">Chart 1</h6>
                    <div id="bar-container-1" class="bar-container">
                    </div>
                </div>
                <div class="col-md-6">
                    <h6 class="text-center text-danger">Chart 2</h6>
                    <div id="bar-container-2" class="bar-container">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="annotate"></div>

        <div class="evaluate">
            <p>
                Time complexity: <span id="time-complexity">O(n&#178;)</span>
            </p>
            <p>
                Stable: <span id="stable">Yes</span>
            </p>
        </div>
    </body>
</html>
